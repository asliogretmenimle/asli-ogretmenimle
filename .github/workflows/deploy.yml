name: Vercel deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret tanımlı değil" >&2
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $status"
          cat response.txt; echo
          [ "$status" -lt 300 ]
